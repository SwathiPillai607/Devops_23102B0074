<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Tracking | Beneficiary System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-tight text-white">Citizen Portal</h1>
      </div>
      <nav class="flex items-center gap-4 text-sm font-medium">
        <a href="/" class="text-slate-400 hover:text-white transition">Register</a>
        <a href="/status-page" class="text-blue-400 font-semibold border-b-2 border-blue-500 pb-0.5">Track Status</a>
        <a href="/admin-page" class="text-slate-400 hover:text-white transition">Admin Portal</a>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto px-6 py-12 space-y-6">

    <!-- Search Card -->
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-8 shadow-2xl backdrop-blur">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-white tracking-wide">Track Application Status</h2>
        <p class="text-slate-400 text-xs mt-1">Enter your generated Reference ID to check real-time verification progress.</p>
      </div>

      <form onsubmit="handleLookup(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Application Reference ID</label>
          <div class="flex gap-2">
            <input type="text" id="refInput" required placeholder="e.g. BEN-94AE35"
              class="flex-1 px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500 transition" />
            <button type="submit" id="searchBtn"
              class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-sm transition duration-200">
              Lookup
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Error Banner -->
    <div id="errorBox" class="hidden p-4 rounded-xl text-sm bg-rose-950/50 text-rose-300 border border-rose-800"></div>

    <!-- Result Card -->
    <div id="resultCard" class="hidden bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700">
        <div>
          <span class="text-xs text-slate-400">Reference Token</span>
          <h3 id="cardRefId" class="text-lg font-mono font-bold text-blue-400"></h3>
        </div>
        <div>
          <span id="cardStatus" class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-4 text-xs">
        <div>
          <span class="text-slate-400 block mb-0.5">Applicant Name</span>
          <span id="cardName" class="text-sm font-semibold text-white"></span>
        </div>
        <div>
          <span class="text-slate-400 block mb-0.5">Scheme Enrolled</span>
          <span id="cardScheme" class="text-sm font-medium text-slate-200"></span>
        </div>
        <div>
          <span class="text-slate-400 block mb-0.5">National ID / Aadhaar</span>
          <span id="cardNationalId" class="font-mono text-slate-300"></span>
        </div>
        <div>
          <span class="text-slate-400 block mb-0.5">Registered On</span>
          <span id="cardDate" class="text-slate-300"></span>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Automatically perform lookup if 'ref' param is present in URL
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref');
      if (ref) {
        document.getElementById('refInput').value = ref;
        fetchStatus(ref);
      }
    });

    function handleLookup(e) {
      e.preventDefault();
      const ref = document.getElementById('refInput').value.trim();
      fetchStatus(ref);
    }

    async function fetchStatus(refId) {
      const searchBtn = document.getElementById('searchBtn');
      const errorBox = document.getElementById('errorBox');
      const resultCard = document.getElementById('resultCard');

      searchBtn.disabled = true;
      searchBtn.textContent = 'Checking...';
      errorBox.classList.add('hidden');
      resultCard.classList.add('hidden');

      try {
        const res = await fetch(`/api/status/${encodeURIComponent(refId)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Application not found');

        document.getElementById('cardRefId').textContent = data.reference_id;
        document.getElementById('cardName').textContent = data.full_name;
        document.getElementById('cardScheme').textContent = data.scheme;
        document.getElementById('cardNationalId').textContent = data.national_id;
        document.getElementById('cardDate').textContent = new Date(data.created_at).toLocaleString();

        const badge = document.getElementById('cardStatus');
        badge.textContent = data.status;
        if (data.status === 'APPROVED') {
          badge.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        } else if (data.status === 'REJECTED') {
          badge.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-rose-500/10 text-rose-400 border border-rose-500/30';
        } else {
          badge.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-yellow-500/10 text-yellow-400 border border-yellow-500/30';
        }

        resultCard.classList.remove('hidden');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Lookup';
      }
    }
  </script>
</body>
</html>
