<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Registration Portal | Beneficiary Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-tight text-white">Citizen Portal</h1>
      </div>
      <nav class="flex items-center gap-4 text-sm font-medium">
        <a href="/" class="text-blue-400 font-semibold border-b-2 border-blue-500 pb-0.5">Register</a>
        <a href="/status-page" class="text-slate-400 hover:text-white transition">Track Status</a>
        <a href="/admin-page" class="text-slate-400 hover:text-white transition">Admin Portal</a>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-12">
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-8 shadow-2xl backdrop-blur">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-white tracking-wide">Beneficiary Registration</h2>
        <p class="text-slate-400 text-xs mt-1">Submit your citizen details to enroll in public assistance programs.</p>
      </div>

      <div id="resultBox" class="hidden mb-6 p-4 rounded-xl text-sm border transition"></div>

      <form id="registrationForm" onsubmit="handleRegistration(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Full Legal Name</label>
          <input type="text" id="fullName" required placeholder="e.g. Swathi Pillai" pattern="^[A-Za-z\s]{3,}$"
            title="Name must contain only letters and be more than 2 characters"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500 transition" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
            <input type="email" id="email" required placeholder="user@example.com"
              class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Phone Number</label>
            <div class="flex rounded-lg border border-slate-700 bg-slate-900 overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
              <span class="inline-flex items-center px-3.5 bg-slate-800 text-slate-400 font-mono text-sm border-r border-slate-700 select-none cursor-not-allowed">
                +91
              </span>
              <input type="tel" id="phone" required maxlength="10" placeholder="9876543210" pattern="^[6-9]\d{9}$"
                title="Phone number must be 10 digits starting with 6, 7, 8, or 9"
                class="w-full px-3.5 py-2.5 bg-transparent text-white text-sm font-mono focus:outline-none placeholder-slate-500 transition" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">National ID / Aadhaar Number</label>
          <input type="text" id="nationalId" required maxlength="12" placeholder="12-digit identification number" pattern="^\d{12}$"
            title="National ID must be exactly 12 digits containing only numbers"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Benefit Scheme</label>
          <select id="scheme" required
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            <option value="Education Grant">Education Grant</option>
            <option value="Healthcare Subsidy">Healthcare Subsidy</option>
            <option value="Housing Support">Housing Support</option>
            <option value="Clean Energy Initiative">Clean Energy Initiative</option>
          </select>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-sm transition duration-200 shadow-lg shadow-blue-600/30">
          Submit Application
        </button>
      </form>
    </div>
  </main>

  <script>
    async function handleRegistration(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const nationalId = document.getElementById('nationalId').value.trim();
      const scheme = document.getElementById('scheme').value;

      // Client-side validations
      if (fullName.length <= 2 || !/^[A-Za-z\s]+$/.test(fullName)) {
        showError("Full Name must contain only letters and spaces and exceed 2 characters.");
        return;
      }
      if (!/^\d{12}$/.test(nationalId)) {
        showError("National ID must be exactly 12 digits with no letters or special characters.");
        return;
      }
      if (!/^[6-9]\d{9}$/.test(phone)) {
        showError("Phone number must be 10 digits starting with 6, 7, 8, or 9.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting application...';
      resultBox.classList.add('hidden');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            phone: phone,
            national_id: nationalId,
            scheme: scheme
          })
        });

        const data = await res.json();
        if (!res.ok) {
          const errMsg = Array.isArray(data.detail) ? data.detail[0].msg : (data.detail || 'Failed to submit application');
          throw new Error(errMsg);
        }

        resultBox.className = 'mb-6 p-4 rounded-xl text-sm bg-emerald-950/50 text-emerald-300 border border-emerald-800 space-y-2';
        resultBox.innerHTML = `
          <div class="font-bold flex items-center gap-2">
            <span>✓</span> Application Submitted Successfully!
          </div>
          <div class="text-xs text-emerald-200">
            Your Reference ID is: 
            <span class="font-mono font-bold text-white bg-slate-900 px-2 py-1 rounded ml-1 tracking-wide select-all">${data.reference_id}</span>
          </div>
          <div class="pt-2 text-xs">
            <a href="/status-page?ref=${data.reference_id}" class="text-blue-400 underline hover:text-blue-300">Track your status here →</a>
          </div>
        `;
        resultBox.classList.remove('hidden');
        document.getElementById('registrationForm').reset();
      } catch (err) {
        showError(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Application';
      }
    }

    function showError(msg) {
      const resultBox = document.getElementById('resultBox');
      resultBox.className = 'mb-6 p-4 rounded-xl text-sm bg-rose-950/50 text-rose-300 border border-rose-800';
      resultBox.innerHTML = `<strong>Validation Error:</strong> ${msg}`;
      resultBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
