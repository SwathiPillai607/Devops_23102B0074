apiVersion: apps/v1
kind: Deployment
metadata:
  name: beneficiary-portal-deployment
  labels:
    app: beneficiary-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beneficiary-portal
  template:
    metadata:
      labels:
        app: beneficiary-portal
    spec:
      containers:
      - name: beneficiary-portal
        image: beneficiary-portal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10